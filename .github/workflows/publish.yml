name: Publish

# Publishing a version to PyPI is permanent: a version number can never be reused. So this workflow
#
#   * runs on a published GitHub release (the release is also what Zenodo archives), and on a manual
#     dispatch that can only reach TestPyPI;
#   * checks that the release tag matches the package version, and checks the built wheel the way a
#     user receives it, before anything is uploaded;
#   * keeps building and publishing in separate jobs, so the job that holds the short-lived OIDC
#     credential shares nothing with the job that runs the build;
#   * uploads through GitHub environments that require the maintainer's approval, with no stored token.
#
# One-time setup (PyPI trusted publishers, Zenodo, environments): docs/publishing.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.7"

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          set -eu
          version="$(uv version --short)"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "::error::The release tag is '$TAG_NAME' but the package version is '$version'."
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the wheel as a user receives it
        run: uv run --no-project python scripts/check_wheel.py dist/*.whl

      - name: Keep the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Dry run on TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write # request the short-lived OIDC token PyPI exchanges for upload rights
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.7"

      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # request the short-lived OIDC token PyPI exchanges for upload rights
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.7"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

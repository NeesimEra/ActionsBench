id: AB-CTL-0001
title: "Step guarded by a constant condition"
is_negative: false
expected:
  - weakness_class: control-flow
    file: .github/workflows/constant-condition.yml
    line: 13
    evidence: "if: ${{ true }}"
rationale: >-
  The step is named 'Publish only from main', which states an intended safeguard, but its
  condition is the constant true, so it imposes no main-branch restriction. GitHub still
  applies the implicit success() status check; true is not equivalent to always(). The
  paper's definition covers flawed always-true safeguards. This synthetic step only
  echoes a message, so the label illustrates an ineffective branch guard rather than
  demonstrating an actual unauthorized publication.
references:
  - https://raw.githubusercontent.com/rhysd/actionlint/main/docs/checks.md
  - https://arxiv.org/html/2601.14455v2
  - https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
provenance: synthetic-minimal
status: ai-reviewed
author: Aliu2211
reviewer: ai:opencode:ses_e9cbd3299ffe5p1Jg66UI4O0Z5
review_record: docs/ai-label-audit-2026-10-22.md#rationale-correction-re-review
added_in: "0.1.0"
notes: >-
  The pattern follows the constant-condition example in actionlint's documentation. The
  paper's rule mapping files both actionlint's if-cond check and poutine's if_always_true
  under this class.

id: AB-NEG-0012
title: "Run step that expands only the pull request number and the commit SHA"
is_negative: true
expected: []
rationale: >-
  The pull request number has an integer representation and github.sha is a commit hash.
  Neither representation admits the shell syntax needed to inject commands in this step.
  A contributor can influence commit contents and therefore the hash, but that does not
  turn the hash into unrestricted shell text. The negative rests on those constrained
  representations, not absence from a scanner's untrusted-property list or a claim that
  attackers have no influence over these values.
references:
  - https://raw.githubusercontent.com/rhysd/actionlint/main/docs/checks.md
  - https://docs.zizmor.sh/audits/
  - https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context
provenance: synthetic-minimal
status: ai-reviewed
author: Aliu2211
reviewer: ai:opencode:ses_e9cbdab14ffeq3bus49D4yfV2g
review_record: docs/ai-label-audit-2026-10-22.md#rationale-correction-re-review
added_in: "0.1.0"
notes: >-
  A probe for precision: zizmor's documentation says that at the pedantic and auditor
  personas the template-injection audit flags every expansion in a code context, even
  likely-safe ones, so a finding under those personas is a configuration effect, not a
  detection.

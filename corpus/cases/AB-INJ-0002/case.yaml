id: AB-INJ-0002
title: contains(...) && untrusted value used in a shell step
is_negative: false
expected:
  - weakness_class: injection
    file: .github/workflows/contains-and-value.yml
    line: 13
    evidence: "&& github.head_ref"
rationale: >-
  contains() looks like a boolean helper, but "a && b" evaluates to b when a is true.
  On a pull_request event github.ref contains "refs/pull/", so the expression returns
  github.head_ref, which the pull request author controls. Reasoned from expression
  semantics; no independent source was found, so this label is proposed.
references:
  - https://docs.github.com/en/actions/reference/security/secure-use
provenance: synthetic-minimal
status: proposed
author: Aliu2211
reviewer: null
added_in: "0.1.0"
notes: Found as a false negative in the author's own challenge scanner, which skipped any expression starting with contains().

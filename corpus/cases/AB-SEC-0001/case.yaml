id: AB-SEC-0001
title: "All repository secrets passed to a reusable workflow"
is_negative: false
expected:
  - weakness_class: secrets-exposure
    file: .github/workflows/inherit.yml
    line: 11
    evidence: "secrets: inherit"
rationale: >-
  secrets: inherit makes all secrets available to the caller eligible for forwarding to
  the called workflow without selecting individual names at this call site. This blanket
  forwarding pattern is what the cited secrets-inherit audit discourages in favor of
  explicit named-secret passing. The callee here is fictional: its actual requirements,
  secret use and any exfiltration are not established. The label identifies overbroad
  forwarding syntax, not proof that this callee needs exactly one secret or leaks one.
references:
  - https://docs.zizmor.sh/audits/
  - https://arxiv.org/html/2601.14455v2
  - https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
provenance: synthetic-minimal
status: ai-reviewed
author: Aliu2211
reviewer: ai:opencode:ses_e9cbd7f21ffewiQ16lnv744ZmR
review_record: docs/ai-label-audit-2026-10-22.md#rationale-correction-re-review
added_in: "0.1.0"
notes: >-
  The called workflow reference is a placeholder: the repository is fictional and the SHA
  is not a real commit. Offline scanners do not resolve it. It is pinned so that only the
  secret handling is labeled. secrets: inherit only works for a workflow in the same
  organization or enterprise as the caller (GitHub's reusable-workflow documentation); the
  fictional example-org is assumed to be the caller's own organization.

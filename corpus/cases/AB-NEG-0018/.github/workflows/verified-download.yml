name: Verified download
on:
  pull_request:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download tool
        run: |
          curl -sSL -o tool.tar.gz https://example.com/releases/tool-1.0.tar.gz
          echo "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef  tool.tar.gz" | sha256sum -c -
          tar xzf tool.tar.gz

id: AB-NEG-0004
title: "Echo-only job requests no token permissions"
is_negative: true
expected: []
rationale: >-
  The echo-only job performs no repository or API operation, so it requests permissions: {}.
  No token scope is granted for an operation that does not need one. This is the clean twin
  of AB-PRM-0001's unnecessary write-all grant, without relying on read-only access being
  the minimum required for this particular job. It does not claim that no GITHUB_TOKEN
  exists or that all unrelated risks are absent.

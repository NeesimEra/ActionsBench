id: AB-NEG-0011
title: "Untrusted value in a multi-line script, passed through the environment"
is_negative: true
expected: []
rationale: >-
  The title is assigned to an environment variable and the script reads it as a quoted
  shell variable, so its content is never parsed as script text, even though the script
  has several lines. Clean twin of AB-INJ-0008.

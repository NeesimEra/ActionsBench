id: AB-NEG-0009
title: "Step guarded by a real condition"
is_negative: true
expected: []
rationale: >-
  The step compares github.ref with refs/heads/main, so the condition is nonconstant and
  rejects ordinary unrelated branches and tags. GitHub string equality is case-insensitive:
  a ref differing only in letter case also matches. This is a negative for the constant
  condition defect in AB-CTL-0001, not certification of an exact case-sensitive branch
  authorization boundary. The step only echoes text; it does not publish anything.
references:

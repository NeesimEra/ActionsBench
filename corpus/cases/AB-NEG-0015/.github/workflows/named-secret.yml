name: One signing secret used
on:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate a build message
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import os

          key = os.environ.get("SIGNING_KEY", "")
          if not key:
              raise SystemExit("SIGNING_KEY is required")
          tag = hmac.new(key.encode(), b"build-output", hashlib.sha256).hexdigest()
          print(tag)
          PY

id: AB-INJ-0007
title: "Composite action sink with shallow indentation, tainted through an input"
is_negative: false
expected:
  - weakness_class: injection
    file: .github/actions/greet/action.yml
    line: 10
    evidence: "${{ inputs.title }}"
rationale: >-
  The caller checks out the repository before loading the local composite action, passes
  the pull request title as an input, and the action expands it into a run step, so the
  title reaches the shell. The step list sits at the same
  indentation as its parent key, which is valid YAML and tests whether a scanner parses
  structure instead of relying on fixed indentation. Demonstrated on 2026-10-04: GitHub's
  published expression engine evaluates the expression to a string that contains the
  attacker's text, and running the resulting script in bash executes it (tools/verify-
  expressions, docs/evidence-audit.md). That experiment checks expression and sink semantics,
  not local-action loading or a live end-to-end workflow run.
references:
  - https://docs.github.com/en/actions/reference/security/secure-use
  - https://docs.github.com/en/actions/tutorials/creating-a-composite-action
provenance: synthetic-minimal
status: ai-reviewed
author: Aliu2211
reviewer: ai:opencode:ses_e9cbdab14ffeq3bus49D4yfV2g
review_record: docs/ai-label-audit-2026-10-22.md#targeted-re-review
added_in: "0.1.0"
notes: >-
  The source is the caller's with input at .github/workflows/caller.yml line 19. By
  convention the label is anchored at the sink. GitHub's secure-use page does not cover
  untrusted values passed through composite action inputs explicitly; the mechanism (the
  expression is expanded into the script text) is the same one it describes for inline
  scripts. The 2026-10-22 agent audit found the original caller omitted checkout; this
  unreleased revision provisions the action first without changing the labeled sink.

id: AB-NEG-0008
title: "Checkout credentials not persisted before an artifact upload"
is_negative: true
expected: []
rationale: >-
  Checkout runs with persist-credentials: false. At checkout 4.2.2, its normal cleanup
  removes checkout authentication from local git config before the upload step, even
  though hidden files are included. This negative concerns checkout-token persistence,
  not proof that an arbitrary checked-out repository contains no other sensitive files.
  Cleanup failures are not demonstrated or ruled out; this assumes successful normal
  cleanup. It is the clean twin of AB-ART-0001 at the same checkout version.
references:
  - https://docs.zizmor.sh/audits/
  - https://github.com/actions/upload-artifact/blob/043fb46d1a93c77aae656e7c1c64a875d1fc6a0a/action.yml
